<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Color Palette Generator</h1>

        <div class="palette-container">
            <div class="color-card">
                <div class="color-display" style="background-color: #FF6B6B"></div>
                <div class="card-content">
                    <div class="hex-value">#FF6B6B</div>
                    <div class="lock-toggle-row">
                        <div class="lock-toggle">
                            <input type="checkbox" class="toggle-input" id="lock-0">
                            <label class="toggle-label" for="lock-0">
                                <span class="toggle-track">
                                    <span class="toggle-thumb"></span>
                                </span>
                                <span class="toggle-text">Locked</span>
                            </label>
                        </div>
                    </div>
                    <div class="card-controls">
                        <button class="copy-btn" title="Copy HEX value">Copy</button>
                    </div>
                    <div class="copy-feedback">Copied!</div>
                </div>
            </div>

            <div class="color-card">
                <div class="color-display" style="background-color: #4ECDC4"></div>
                <div class="card-content">
                    <div class="hex-value">#4ECDC4</div>
                    <div class="lock-toggle-row">
                        <div class="lock-toggle">
                            <input type="checkbox" class="toggle-input" id="lock-1">
                            <label class="toggle-label" for="lock-1">
                                <span class="toggle-track">
                                    <span class="toggle-thumb"></span>
                                </span>
                                <span class="toggle-text">Locked</span>
                            </label>
                        </div>
                    </div>
                    <div class="card-controls">
                        <button class="copy-btn" title="Copy HEX value">Copy</button>
                    </div>
                    <div class="copy-feedback">Copied!</div>
                </div>
            </div>

            <div class="color-card">
                <div class="color-display" style="background-color: #45B7D1"></div>
                <div class="card-content">
                    <div class="hex-value">#45B7D1</div>
                    <div class="lock-toggle-row">
                        <div class="lock-toggle">
                            <input type="checkbox" class="toggle-input" id="lock-2">
                            <label class="toggle-label" for="lock-2">
                                <span class="toggle-track">
                                    <span class="toggle-thumb"></span>
                                </span>
                                <span class="toggle-text">Locked</span>
                            </label>
                        </div>
                    </div>
                    <div class="card-controls">
                        <button class="copy-btn" title="Copy HEX value">Copy</button>
                    </div>
                    <div class="copy-feedback">Copied!</div>
                </div>
            </div>

            <div class="color-card">
                <div class="color-display" style="background-color: #96CEB4"></div>
                <div class="card-content">
                    <div class="hex-value">#96CEB4</div>
                    <div class="lock-toggle-row">
                        <div class="lock-toggle">
                            <input type="checkbox" class="toggle-input" id="lock-3">
                            <label class="toggle-label" for="lock-3">
                                <span class="toggle-track">
                                    <span class="toggle-thumb"></span>
                                </span>
                                <span class="toggle-text">Locked</span>
                            </label>
                        </div>
                    </div>
                    <div class="card-controls">
                        <button class="copy-btn" title="Copy HEX value">Copy</button>
                    </div>
                    <div class="copy-feedback">Copied!</div>
                </div>
            </div>

            <div class="color-card">
                <div class="color-display" style="background-color: #FECA57"></div>
                <div class="card-content">
                    <div class="hex-value">#FECA57</div>
                    <div class="lock-toggle-row">
                        <div class="lock-toggle">
                            <input type="checkbox" class="toggle-input" id="lock-4">
                            <label class="toggle-label" for="lock-4">
                                <span class="toggle-track">
                                    <span class="toggle-thumb"></span>
                                </span>
                                <span class="toggle-text">Locked</span>
                            </label>
                        </div>
                    </div>
                    <div class="card-controls">
                        <button class="copy-btn" title="Copy HEX value">Copy</button>
                    </div>
                    <div class="copy-feedback">Copied!</div>
                </div>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate New Palette</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
