
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="glow-effect"></div>

        <div class="header">
            <h1>Pomodoro Timer</h1>
            <div class="subtitle">Focus Session Timer</div>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="focus">Focus</button>
            <button class="mode-btn" data-mode="break">Break</button>
        </div>

        <div class="timer-container" id="timerContainer">
            <svg class="progress-ring" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color: #ffffff; stop-opacity: 1" />
                        <stop offset="100%" style="stop-color: #9e9e9e; stop-opacity: 1" />
                    </linearGradient>
                </defs>
                <circle class="progress-ring__circle-bg" cx="50" cy="50" r="45" fill="none" stroke="#333333"
                    stroke-width="8" />
                <circle class="progress-ring__circle" cx="50" cy="50" r="45" stroke-dasharray="282.7"
                    stroke-dashoffset="282.7" />
            </svg>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="mode-label" id="modeLabel">FOCUS</div>
        </div>

        <div class="controls-section">
            <div class="durations">
                <div class="durations-label">Preset Durations</div>
                <div class="duration-buttons">
                    <button class="duration-btn" data-duration="15">15</button>
                    <button class="duration-btn" data-duration="25">25</button>
                    <button class="duration-btn" data-duration="30">30</button>
                    <button class="duration-btn" data-duration="45">45</button>
                    <button class="duration-btn" data-duration="60">60</button>
                </div>
                <div class="custom-duration">
                    <input type="number" class="custom-input" id="customMinutes" placeholder="Min" min="1" max="120">
                    <button class="set-duration-btn" id="setCustomDuration">Set</button>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn secondary" id="resetBtn">Reset</button>
            <button class="action-btn primary" id="startBtn">Start</button>
        </div>

        <div class="stats">
            <span>Pomodoros completed:</span>
            <span class="stat-value" id="pomodoroCount">0</span>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
